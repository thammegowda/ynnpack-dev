name: Build and Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            arch: x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            arch: arm64
          - name: windows-x64
            os: windows-2025
            arch: x64
          - name: windows-arm64
            os: windows-11-arm
            arch: arm64
          - name: macos-arm64
            os: macos-26
            arch: arm64
    defaults:
      run:
        shell: bash
    env:
      CC: clang
      CXX: clang++
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Windows SDK environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'x64' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}

      - name: Install build tools
        run: python -m pip install 'cmake>=3.25,<4' ninja

      - name: Use available CPUs
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cores=$(sysctl -n hw.logicalcpu)
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            cores="$NUMBER_OF_PROCESSORS"
          else
            cores=$(nproc)
          fi
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$cores" >> "$GITHUB_ENV"
          echo "Using $cores parallel build and test jobs"

      - name: Configure
        run: |
          compiler_args=()
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            if [[ "$BUILD_ARCH" == "arm64" ]]; then
              target=aarch64-pc-windows-msvc
            else
              target=x86_64-pc-windows-msvc
            fi
            compiler_args+=(
              "-DCMAKE_C_COMPILER_TARGET=$target"
              "-DCMAKE_CXX_COMPILER_TARGET=$target"
              "-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld"
            )
          fi
          cmake -S . -B build -G Ninja \
            "${compiler_args[@]}" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DYNNPACK_BUILD_TESTS=ON \
            -DYNNPACK_BUILD_BENCHMARKS=OFF \
            2>&1 | tee configure.log

      - name: Build library and tests
        run: cmake --build build 2>&1 | tee build.log

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error \
            --parallel "$CMAKE_BUILD_PARALLEL_LEVEL" --timeout 600 \
            --output-junit "$GITHUB_WORKSPACE/build/test-results.xml"

      - name: Upload test results and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            configure.log
            build.log
            build/test-results.xml
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/Testing/Temporary/*.log