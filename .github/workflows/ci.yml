name: Build and Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    defaults:
      run:
        shell: bash
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install 'cmake>=3.25,<4' ninja

      - name: Use available CPUs
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cores=$(sysctl -n hw.logicalcpu)
          else
            cores=$(nproc)
          fi
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$cores" >> "$GITHUB_ENV"
          echo "Using $cores parallel build and test jobs"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DYNNPACK_BUILD_TESTS=ON \
            -DYNNPACK_BUILD_BENCHMARKS=OFF \
            2>&1 | tee configure.log

      - name: Build library and tests
        run: cmake --build build 2>&1 | tee build.log

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error \
            --parallel "$CMAKE_BUILD_PARALLEL_LEVEL" --timeout 600 \
            --output-junit "$GITHUB_WORKSPACE/build/test-results.xml"

      - name: Upload test results and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            configure.log
            build.log
            build/test-results.xml
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/Testing/Temporary/*.log